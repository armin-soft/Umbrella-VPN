name: Windows installer draft
on:
  push:
    branches: ['arena/**', Default]
    paths: ['Windows/**', 'Telegram-BOT/**', '.github/workflows/windows-draft.yml']
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release mode (draft, beta prerelease, or stable release)'
        required: false
        default: 'draft'
        type: choice
        options:
          - draft
          - beta
          - release
      beta_number:
        description: 'Beta sequence number when channel is beta (e.g. 1)'
        required: false
        default: '1'
        type: string
permissions:
  contents: write
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  telegram-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint and test Telegram-BOT
        run: |
          set -euo pipefail
          find Telegram-BOT -name '*.php' -print0 | xargs -0 -n1 php -l
          for test_file in Telegram-BOT/tests/*_test.php; do
            echo "Running $test_file"
            if ! out=$(php "$test_file" 2>&1); then
              esc="${out//%/%25}"
              esc="${esc//$'\r'/}"
              esc="${esc//$'\n'/%0A}"
              echo "::error title=$test_file::$esc"
              exit 1
            fi
            echo "$out"
          done
  installer:
    needs: telegram-bot
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Prepare Flutter scaffold without replacing the custom runner
        run: |
          $scaffold = Join-Path $env:RUNNER_TEMP 'umbrella_scaffold'
          flutter create --platforms=windows --project-name umbrella_vpn $scaffold
          if ($LASTEXITCODE -ne 0) { throw 'Flutter scaffold failed' }
          New-Item -ItemType Directory -Force windows/flutter | Out-Null
          Copy-Item "$scaffold/windows/flutter/CMakeLists.txt" windows/flutter/CMakeLists.txt
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies failed' }
      - name: Analyze and test
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'diagnostics/Test-NetworkPath.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          flutter analyze --no-fatal-infos 2>&1 | Tee-Object -Variable analysis
          if ($LASTEXITCODE -ne 0) {
            $detail = ($analysis | Out-String).Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error::$detail"
            throw 'Analysis failed'
          }
          flutter test --reporter expanded 2>&1 | Tee-Object -Variable tests
          if ($LASTEXITCODE -ne 0) {
            $detail = ($tests | Where-Object { "$_" -notmatch '^\d\d:\d\d ' -or "$_" -match '\[E\]|failed' } | Out-String).Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error::$detail"
            throw 'Tests failed'
          }
      - name: Build Windows and bundle verified engine
        run: |
          flutter build windows --release 2>&1 | Tee-Object -Variable buildLog
          if ($LASTEXITCODE -ne 0) {
            $detail = ($buildLog | Out-String).Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error::$detail"
            throw 'Windows build failed'
          }
          $bundle = 'build/windows/x64/runner/Release'
          foreach ($exe in @('UmbrellaVPN.exe','UmbrellaCli.exe','UmbrellaAdmin.exe','UmbrellaCoreEngine.exe')) {
            if (!(Test-Path "$bundle/$exe")) { throw "Missing launcher: $exe" }
          }
          $manifest = Get-Content assets/cores/manifest.json -Raw | ConvertFrom-Json
          $core = $manifest.cores | Where-Object id -eq 'hiddify'
          $archive = Join-Path $env:RUNNER_TEMP 'umbrella-core.tar.gz'
          Invoke-WebRequest $core.url -OutFile $archive
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $core.sha256) { throw 'Engine digest mismatch' }
          $extract = Join-Path $env:RUNNER_TEMP 'umbrella-core'
          New-Item -ItemType Directory -Force $extract | Out-Null
          tar -xzf $archive -C $extract
          if ($LASTEXITCODE -ne 0) { throw 'Engine extraction failed' }
          New-Item -ItemType Directory -Force "$bundle/cores/umbrella" | Out-Null
          foreach ($mapping in @(@{from='hiddify-core.dll';to='UmbrellaCore.dll'}, @{from='libcronet.dll';to='libcronet.dll'})) {
            $source = @(Get-ChildItem $extract -Recurse -Filter $mapping.from)
            if ($source.Count -ne 1) { throw "Missing or ambiguous engine library $($mapping.from)" }
            Copy-Item $source[0].FullName "$bundle/cores/umbrella/$($mapping.to)"
          }
          Copy-Item THIRD-PARTY-NOTICES.txt "$bundle/THIRD-PARTY-NOTICES.txt"
          Copy-Item licenses "$bundle/licenses" -Recurse
      - name: Verify generated configuration using the bundled core
        run: |
          $env:UMBRELLA_CORE_SMOKE = (Resolve-Path 'build/windows/x64/runner/Release/UmbrellaCli.exe').Path
          flutter test test/core_engine_contract_test.dart --reporter expanded 2>&1 | Tee-Object -Variable coreTests
          if ($LASTEXITCODE -ne 0) {
            $detail = ($coreTests | Out-String).Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error::$detail"
            throw 'Bundled core contract tests failed'
          }
      - name: Compile installer
        run: |
          $iscc = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          & $iscc installer/umbrella.iss 2>&1 | Tee-Object -Variable installerLog
          if ($LASTEXITCODE -ne 0) {
            $detail = ($installerLog | Out-String).Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error::$detail"
            throw 'Installer compilation failed'
          }
          $files = @(Get-ChildItem installer/output -Filter '*.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one installer' }
          Get-FileHash $files[0].FullName -Algorithm SHA256
      - name: Publish installer-only release or draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          RELEASES_REPO: 'armin-soft/Umbrella-VPN-Releases'
          CHANNEL: ${{ inputs.channel || 'draft' }}
          BETA_NUM: ${{ inputs.beta_number || '1' }}
          COMMIT: ${{ github.sha }}
        run: |
          $version = [regex]::Match((Get-Content lib/core/app_config.dart -Raw), "static const String version = '([^']+)'").Groups[1].Value
          if (!$version) { throw 'Missing version' }
          $installer = (Get-ChildItem installer/output -Filter '*.exe').FullName
          $sha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = @(
            "- رابط کاملا فارسی با اعداد فارسی و بدون نیم فاصله در سراسر برنامه",
            "- آیکون گرد و کاملا شفاف در نصب کننده، میانبرها، سینی سیستم و تمام صفحات",
            "- منوی بازشوی استاندارد تنظیمات سریع اتصال و آیکون دقیق برای همه بخش ها",
            "- هسته آمبرلا نسخه ۵.۹.۱۱ با پایداری تونل و بستن کامل پردازش ها هنگام خروج",
            "- به روز رسانی درون برنامه ای در دو کانال پایدار و بتا با تایید اصالت فایل",
            "SHA-256: $sha256"
          ) -join "`n"

          if (($env:CHANNEL -eq 'beta' -or $env:CHANNEL -eq 'release') -and $env:RELEASES_TOKEN) {
            $env:GH_TOKEN = $env:RELEASES_TOKEN
            $betaClean = ($env:BETA_NUM -replace '[^0-9]', '')
            if (!$betaClean) { $betaClean = '1' }
            $tag = if ($env:CHANNEL -eq 'beta') { "v$version-beta.$betaClean-windows" } else { "v$version-windows" }
            $title = if ($env:CHANNEL -eq 'beta') { "Umbrella VPN $version Beta $betaClean - Windows (x64)" } else { "Umbrella VPN $version - Windows (x64)" }
            $exists = gh release view $tag --repo $env:RELEASES_REPO --json tagName 2>$null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $installer --clobber --repo $env:RELEASES_REPO
              if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
              gh release edit $tag --repo $env:RELEASES_REPO --title $title --notes $notes
            } elseif ($env:CHANNEL -eq 'beta') {
              gh release create $tag $installer --repo $env:RELEASES_REPO --target main --prerelease --title $title --notes $notes
            } else {
              gh release create $tag $installer --repo $env:RELEASES_REPO --target main --latest --title $title --notes $notes
            }
            if ($LASTEXITCODE -ne 0) { throw 'Public release publication failed' }
            gh release view $tag --repo $env:RELEASES_REPO --json url,isDraft,isPrerelease,assets
            if ($LASTEXITCODE -ne 0) { throw 'Public release verification failed' }
            return
          }

          $tag = "v$version-windows"
          $existing = gh release view $tag --repo $env:SOURCE_REPO --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (!$release.isDraft) { throw 'Refusing to replace a published release' }
            gh release edit $tag --repo $env:SOURCE_REPO --target $env:COMMIT --draft --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Draft update failed' }
            gh release upload $tag $installer --clobber --repo $env:SOURCE_REPO
          } else {
            gh release create $tag $installer --repo $env:SOURCE_REPO --target $env:COMMIT --draft --title "Umbrella VPN $version - Windows (x64)" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed' }
          gh release view $tag --repo $env:SOURCE_REPO --json url,isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft verification failed' }
