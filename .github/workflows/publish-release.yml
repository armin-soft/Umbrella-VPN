name: Publish Combined 1.0.2 Release

on:
  push:
    branches: ['arena/**', Default]
    paths: ['.github/workflows/publish-release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download latest Windows and Android 1.0.2 installers
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets

          # 1. Latest Windows x64 installer from the v1.0.2-windows draft release
          gh release download v1.0.2-windows --repo "$SOURCE_REPO" -p 'UmbrellaVPN-Setup-1.0.2-x64.exe' --dir release-assets --clobber
          test -s release-assets/UmbrellaVPN-Setup-1.0.2-x64.exe

          # 2. Latest signed Android APKs from the v1.0.2-android draft release
          gh release download v1.0.2-android --repo "$SOURCE_REPO" -p '*.apk' -p 'SHA256SUMS.txt' --dir release-assets --clobber
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          rm -f release-assets/SHA256SUMS.txt

          for apk in \
            UmbrellaVPN-1.0.2-universal.apk \
            UmbrellaVPN-1.0.2-arm64-v8a.apk \
            UmbrellaVPN-1.0.2-armeabi-v7a.apk \
            UmbrellaVPN-1.0.2-x86_64.apk; do
            test -s "release-assets/$apk"
          done

          # 3. Unified SHA256SUMS.txt covering both Windows and Android installers
          (
            cd release-assets
            sha256sum \
              UmbrellaVPN-Setup-1.0.2-x64.exe \
              UmbrellaVPN-1.0.2-universal.apk \
              UmbrellaVPN-1.0.2-arm64-v8a.apk \
              UmbrellaVPN-1.0.2-armeabi-v7a.apk \
              UmbrellaVPN-1.0.2-x86_64.apk > SHA256SUMS.txt
          )
          ls -lh release-assets
          cat release-assets/SHA256SUMS.txt

      - name: Publish 1.0.2 release with Windows and Android assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          RELEASES_REPO: 'armin-soft/Umbrella-VPN-Releases'
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="1.0.2"
          TITLE="Umbrella VPN 1.0.2"
          printf '%s\n' \
            '🇮🇷فیلترشکن آمبرلا نسخه ۱.۰.۲' \
            '' \
            '- امضای دائمی و یکپارچه نسخه اندروید با گواهی رسمی انتشار برای سازگاری با بروزرسانی درون برنامه ای و Google Play Protect' \
            '- استانداردسازی دسترسی فایل ها و پاکسازی در اسکنر امنیتی اندروید با Storage Access Framework و APIهای رسمی اندروید (حذف مجوزهای پرخطر مانیفست)' \
            '- حفظ کامل اسکنر امنیتی بومی، مسدودسازی لینک های مخرب، پایش پوشه انتخابی و بروزرسانی درون برنامه ای با تایید SHA-256' \
            '- بستن خودکار فیلترشکن ها، سرویس ها و تونل های وی پی ان فعال قبلی هنگام اتصال تونل در اندروید و ویندوز' \
            '- نمایش فوری وضعیت «در حال اتصال»، لغو سریع اتصال و کاهش محسوس زمان اتصال در اندروید و ویندوز' \
            '- رفع مشکل بازاتصال خودکار اندروید، بهبود مدیریت دستگاه های فعال و هماهنگی کامل با کلاینت ویندوز' \
            > notes.txt

          publish_to_repo() {
            local target_repo="$1"
            local release_target="$2"
            local token="$3"

            GH_TOKEN="$token" gh release view "$TAG" --repo "$target_repo" --json tagName >/dev/null 2>&1 && exists=1 || exists=0
            if [ "$exists" -eq 1 ]; then
              if [ "$target_repo" = "$SOURCE_REPO" ]; then
                GH_TOKEN="$token" gh api --method PATCH "repos/$target_repo/git/refs/tags/$TAG" -f sha="$release_target" -F force=true >/dev/null 2>&1 || true
              fi
              GH_TOKEN="$token" gh release upload "$TAG" release-assets/* --clobber --repo "$target_repo"
              GH_TOKEN="$token" gh release edit "$TAG" --repo "$target_repo" \
                --title "$TITLE" \
                --notes-file notes.txt \
                --draft=false \
                --prerelease=false \
                --latest
            else
              GH_TOKEN="$token" gh release create "$TAG" release-assets/* \
                --repo "$target_repo" \
                --target "$release_target" \
                --title "$TITLE" \
                --notes-file notes.txt \
                --latest
            fi
          }

          PUBLISHED_REPO=""
          if [ -n "${RELEASES_TOKEN:-}" ]; then
            echo "RELEASES_TOKEN is set; attempting to publish to $RELEASES_REPO..."
            RELEASES_BRANCH=$(GH_TOKEN="$RELEASES_TOKEN" gh repo view "$RELEASES_REPO" --json defaultBranchRef --jq '.defaultBranchRef.name' 2>/dev/null || true)
            [ -z "$RELEASES_BRANCH" ] && RELEASES_BRANCH="Default"
            echo "Resolved $RELEASES_REPO target branch: $RELEASES_BRANCH"
            if publish_to_repo "$RELEASES_REPO" "$RELEASES_BRANCH" "$RELEASES_TOKEN"; then
              PUBLISHED_REPO="$RELEASES_REPO"
              echo "::notice::Published $TAG to $RELEASES_REPO (target $RELEASES_BRANCH)"
            else
              echo "::warning::Failed publishing to $RELEASES_REPO (target $RELEASES_BRANCH) using RELEASES_TOKEN; falling back to $SOURCE_REPO."
            fi
          else
            echo "::warning::RELEASES_TOKEN secret is not configured; falling back to $SOURCE_REPO."
          fi

          publish_to_repo "$SOURCE_REPO" "$COMMIT" "$GH_TOKEN"
          echo "::notice::Published $TAG to $SOURCE_REPO"
          if [ -z "$PUBLISHED_REPO" ]; then
            PUBLISHED_REPO="$SOURCE_REPO"
          fi

          echo "PUBLISHED_REPO=$PUBLISHED_REPO"
          verify_token="$GH_TOKEN"
          if [ "$PUBLISHED_REPO" = "$RELEASES_REPO" ]; then
            verify_token="$RELEASES_TOKEN"
          fi
          GH_TOKEN="$verify_token" gh release view "$TAG" --repo "$PUBLISHED_REPO" \
            --json url,tagName,name,isDraft,isPrerelease,body,assets \
            --jq '{url, tagName, name, isDraft, isPrerelease, body, assets: [.assets[] | {name, size}]}'
