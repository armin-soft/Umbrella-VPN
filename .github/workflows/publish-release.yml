name: Publish Combined 1.0.0 Release

on:
  push:
    branches: ['arena/**', Default]
    paths: ['.github/workflows/publish-release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download latest Windows and Android 1.0.0 installers
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets

          # 1. Windows x64 installer built from the latest commit on this branch
          if gh run download 45229361587 --repo "$SOURCE_REPO" --name UmbrellaVPN-Setup-1.0.0-x64 --dir release-assets; then
            found_exe=$(find release-assets -type f -name 'UmbrellaVPN-Setup-1.0.0-x64.exe' | head -n1 || true)
            if [ -n "$found_exe" ] && [ "$found_exe" != "release-assets/UmbrellaVPN-Setup-1.0.0-x64.exe" ]; then
              mv -f "$found_exe" release-assets/UmbrellaVPN-Setup-1.0.0-x64.exe
            fi
          else
            gh release download v1.0.0-windows --repo "$SOURCE_REPO" -p 'UmbrellaVPN-Setup-1.0.0-x64.exe' --dir release-assets --clobber
          fi
          test -s release-assets/UmbrellaVPN-Setup-1.0.0-x64.exe

          # 2. Android APKs built from commit 3a99f76 (verified green CI build)
          gh release download v1.0.0-android --repo "$SOURCE_REPO" -p '*.apk' -p 'SHA256SUMS.txt' --dir release-assets --clobber
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          rm -f release-assets/SHA256SUMS.txt

          for apk in \
            UmbrellaVPN-1.0.0-universal.apk \
            UmbrellaVPN-1.0.0-arm64-v8a.apk \
            UmbrellaVPN-1.0.0-armeabi-v7a.apk \
            UmbrellaVPN-1.0.0-x86_64.apk; do
            test -s "release-assets/$apk"
          done

          # 3. Unified SHA256SUMS.txt covering both Windows and Android installers
          (
            cd release-assets
            sha256sum \
              UmbrellaVPN-Setup-1.0.0-x64.exe \
              UmbrellaVPN-1.0.0-universal.apk \
              UmbrellaVPN-1.0.0-arm64-v8a.apk \
              UmbrellaVPN-1.0.0-armeabi-v7a.apk \
              UmbrellaVPN-1.0.0-x86_64.apk > SHA256SUMS.txt
          )
          ls -lh release-assets
          cat release-assets/SHA256SUMS.txt

      - name: Publish 1.0.0 release with Windows and Android assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          RELEASES_REPO: 'armin-soft/Umbrella-VPN-Releases'
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="1.0.0"
          TITLE="Umbrella VPN 1.0.0"
          printf '%s' '🇮🇷فیلترشکن آمبرلا نسخه ۱.۰.۰' > notes.txt

          publish_to_repo() {
            local target_repo="$1"
            local release_target="$2"
            local token="$3"

            GH_TOKEN="$token" gh release view "$TAG" --repo "$target_repo" --json tagName >/dev/null 2>&1 && exists=1 || exists=0
            if [ "$exists" -eq 1 ]; then
              GH_TOKEN="$token" gh release upload "$TAG" release-assets/* --clobber --repo "$target_repo"
              GH_TOKEN="$token" gh release edit "$TAG" --repo "$target_repo" \
                --title "$TITLE" \
                --notes-file notes.txt \
                --draft=false \
                --prerelease=false \
                --latest
            else
              GH_TOKEN="$token" gh release create "$TAG" release-assets/* \
                --repo "$target_repo" \
                --target "$release_target" \
                --title "$TITLE" \
                --notes-file notes.txt \
                --latest
            fi
          }

          PUBLISHED_REPO=""
          if [ -n "${RELEASES_TOKEN:-}" ]; then
            echo "RELEASES_TOKEN is set; attempting to publish to $RELEASES_REPO..."
            if publish_to_repo "$RELEASES_REPO" "main" "$RELEASES_TOKEN"; then
              PUBLISHED_REPO="$RELEASES_REPO"
            else
              echo "Failed publishing to $RELEASES_REPO using RELEASES_TOKEN; falling back to $SOURCE_REPO."
            fi
          else
            echo "RELEASES_TOKEN secret is not configured; falling back to $SOURCE_REPO."
          fi

          if [ -z "$PUBLISHED_REPO" ]; then
            publish_to_repo "$SOURCE_REPO" "$COMMIT" "$GH_TOKEN"
            PUBLISHED_REPO="$SOURCE_REPO"
          fi

          echo "PUBLISHED_REPO=$PUBLISHED_REPO"
          verify_token="$GH_TOKEN"
          if [ "$PUBLISHED_REPO" = "$RELEASES_REPO" ]; then
            verify_token="$RELEASES_TOKEN"
          fi
          GH_TOKEN="$verify_token" gh release view "$TAG" --repo "$PUBLISHED_REPO" \
            --json url,tagName,name,isDraft,isPrerelease,body,assets \
            --jq '{url, tagName, name, isDraft, isPrerelease, body, assets: [.assets[] | {name, size}]}'
