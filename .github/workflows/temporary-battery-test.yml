name: Temporary battery diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test targeted
        run: |
          flutter test test/battery_menu_test.dart test/power_optimization_test.dart test/proxy_link_performance_test.dart --reporter expanded --timeout 45s 2>&1 | Tee-Object -Variable tests
          if ($LASTEXITCODE -ne 0) {
            $detail = ($tests | Out-String).Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error::$detail"
            throw 'Tests failed'
          }
