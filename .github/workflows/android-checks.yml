name: Android dependency and tests

on:
  push:
    paths:
      - 'Android/**'
      - '.github/workflows/android-checks.yml'
  pull_request:
    paths:
      - 'Android/**'
      - '.github/workflows/android-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true
      - run: flutter pub get
      - run: flutter test
