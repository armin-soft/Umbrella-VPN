name: Android dependency and tests

on:
  push:
    paths:
      - 'Android/**'
      - '.github/workflows/android-checks.yml'
  pull_request:
    paths:
      - 'Android/**'
      - '.github/workflows/android-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true
      - name: Resolve dependencies
        shell: bash
        run: |
          if ! flutter pub get > pub-output.txt 2>&1; then
            cat pub-output.txt
            message=$(tail -25 pub-output.txt | tr '\n' ' ')
            echo "::error::$message"
            exit 1
          fi
          cat pub-output.txt
      - name: Run tests
        shell: bash
        run: |
          if ! flutter test --reporter expanded > test-output.txt 2>&1; then
            cat test-output.txt
            message=$(tail -60 test-output.txt | tr '\n' ' ' | cut -c1-12000)
            echo "::error::$message"
            exit 1
          fi
          cat test-output.txt
