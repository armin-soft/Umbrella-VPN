name: Android dependency and tests

on:
  push:
    paths:
      - 'Android/**'
      - '.github/workflows/android-checks.yml'
  pull_request:
    paths:
      - 'Android/**'
      - '.github/workflows/android-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-archive:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download the same engine version as Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v5.9.11 --repo hiddify/hiddify-core \
            --pattern hiddify-lib-android.tar.gz --dir "$RUNNER_TEMP"
          echo '853e897ee2dcbde30801314eb30346e0a4fc61c38f6b4fc4ee901a18fabec3a9  '"$RUNNER_TEMP"'/hiddify-lib-android.tar.gz' | sha256sum --check
          tar -tzf "$RUNNER_TEMP/hiddify-lib-android.tar.gz" > "$RUNNER_TEMP/core-files.txt"
          echo "::notice::Android core archive verified: $(tr '\n' ' ' < "$RUNNER_TEMP/core-files.txt" | cut -c1-1000)"
  native-bridge-compile:
    # Compile the actual app with the verified engine. It is still incomplete:
    # the debug APK is not published or presented as a working VPN.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.5'
          cache: true
      - name: Fetch verified mobile engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Android/tools/fetch-umbrella-core.sh
      - name: Compile actual Android app (debug, not for release)
        shell: bash
        working-directory: Android
        run: |
          if ! flutter build apk --debug > "$RUNNER_TEMP/native-check.log" 2>&1; then
            cat "$RUNNER_TEMP/native-check.log"
            message=$(tail -60 "$RUNNER_TEMP/native-check.log" | tr '\n' ' ' | cut -c1-12000)
            echo "::error::$message"
            exit 1
          fi
          echo '::notice::Actual app debug build succeeded; VPN integration remains unverified.'
      - name: Test release build with a disposable CI key
        working-directory: Android
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-test.keystore" -storepass testonly -keypass testonly -alias test -dname 'CN=CI test only' -keyalg RSA -keysize 2048 -validity 1
          export UMBRELLA_ANDROID_KEYSTORE="$RUNNER_TEMP/ci-test.keystore"
          export UMBRELLA_ANDROID_STORE_PASSWORD=testonly UMBRELLA_ANDROID_KEY_ALIAS=test UMBRELLA_ANDROID_KEY_PASSWORD=testonly
          if ! flutter build apk --release > "$RUNNER_TEMP/release-check.log" 2>&1; then
            cat "$RUNNER_TEMP/release-check.log"
            message=$(tail -60 "$RUNNER_TEMP/release-check.log" | tr '\n' ' ' | cut -c1-12000)
            echo "::error::$message"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/ci-test.keystore"
      - name: Save experimental debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UmbrellaVPN-Android-experimental-debug
          path: Android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.5'
          cache: true
      - name: Resolve dependencies
        shell: bash
        run: |
          if ! flutter pub get > pub-output.txt 2>&1; then
            cat pub-output.txt
            message=$(tail -25 pub-output.txt | tr '\n' ' ')
            echo "::error::$message"
            exit 1
          fi
          cat pub-output.txt
      - name: Run tests
        shell: bash
        run: |
          if ! timeout 300s flutter test --reporter expanded > test-output.txt 2>&1; then
            cat test-output.txt
            message=$(grep -E 'Error:|Actual:|Expected:|overflowed| at Size\(' test-output.txt | head -80 | tr '\n' ' ' | cut -c1-12000 || true)
            if [ -z "$message" ]; then message=$(tail -40 test-output.txt | tr '\n' ' ' | cut -c1-12000); fi
            echo "::error::$message"
            details=$(grep -A 5 'The relevant error-causing widget was:' test-output.txt | head -120 | tr '\n' ' ' | cut -c1-12000 || true)
            if [ -n "$details" ]; then echo "::error::$details"; fi
            exit 1
          fi
          cat test-output.txt
