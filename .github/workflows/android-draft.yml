name: Android experimental draft

# Optimized release-mode builds with a disposable draft-only key, not production.
on:
  workflow_dispatch:
  # This branch is the only automatic draft source; ordinary Android changes
  # do not trigger a new draft unless this workflow itself changes.
  push:
    branches: [arena/41b839a7-umbrella-vpn]
    paths: ['.github/workflows/android-draft.yml']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.5'
          cache: true
      - name: Fetch verified mobile engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Android/tools/fetch-umbrella-core.sh
      - name: Test and build optimized draft APKs
        working-directory: Android
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test
          # Throwaway signing key: draft APKs are not upgrade-compatible with
          # subsequent runs or with a production key. Never publish the key.
          keytool -genkeypair -keystore "$RUNNER_TEMP/draft.keystore" -storepass draftonly -keypass draftonly -alias draft -dname 'CN=Umbrella draft only' -keyalg RSA -keysize 2048 -validity 30
          export UMBRELLA_ANDROID_KEYSTORE="$RUNNER_TEMP/draft.keystore"
          export UMBRELLA_ANDROID_STORE_PASSWORD=draftonly UMBRELLA_ANDROID_KEY_ALIAS=draft UMBRELLA_ANDROID_KEY_PASSWORD=draftonly
          flutter build apk --release --split-per-abi
          rm -f "$RUNNER_TEMP/draft.keystore"
          mkdir -p "$RUNNER_TEMP/umbrella-android"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "$RUNNER_TEMP/umbrella-android/UmbrellaVPN-Android-draft-$abi.apk"
          done
          cd "$RUNNER_TEMP/umbrella-android"
          sha256sum ./*.apk > SHA256SUMS
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/draft.keystore"
      - name: Create draft (never publish automatically)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/android-draft-notes.md" <<'EOF'
          Experimental Android release-mode draft, not a production release.

          - Choose arm64-v8a for most modern Android phones, armeabi-v7a for older 32-bit ARM phones, or x86_64 for compatible emulators/devices.
          - The APK uses a disposable draft signing key. Future builds and the earlier debug build cannot upgrade it; uninstalling an incompatible build may remove app data. It is not suitable for production distribution.
          - Automated tests cover menu navigation and selected interactions, including rejecting unsupported Android connection modes and LAN sharing. Several features remain unverified; physical-device, accessibility and real-account testing are still required.
          - VPN traffic, installation, upgrades, and Android lifecycle behavior have not been verified on a physical device. Android versions below 29 currently fail closed when checking traffic.
          - Connection failures show a non-sensitive stage-specific message for diagnosis; this is not proof that the connection issue is fixed.
          - SMS code filling requires Google Play services and explicit consent to share the incoming message. Manual entry remains available.
          - Some connection modes are not supported. Do not rely on this build to protect traffic or privacy.
          - Bundled components have upstream licensing conditions that must be reviewed before any public release.
          - SHA256SUMS provides the APK checksum. This draft is not published automatically.
          EOF
          gh release create "android-draft-${GITHUB_RUN_ID}" \
            "$RUNNER_TEMP"/umbrella-android/*.apk \
            "$RUNNER_TEMP/umbrella-android/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title 'Umbrella VPN Android — experimental draft' \
            --notes-file "$RUNNER_TEMP/android-draft-notes.md"
