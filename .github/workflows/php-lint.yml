name: php lint

on:
  push:
    paths:
      - 'Telegram-BOT/**'
      - '.github/workflows/php-lint.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP version
        run: php --version

      - name: Lint every PHP file
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          Fail=0
          Out=""
          while IFS= read -r -d '' File; do
            if ! Result=$(php -l "$File" 2>&1); then
              Fail=1
              Out+="$Result"$'\n'
            fi
          done < <(find Telegram-BOT -name '*.php' -print0)
          if [ "$Fail" -ne 0 ]; then
            echo "$Out"
            {
              echo "### php -l errors"
              echo "<pre>"
              printf '%s\n' "$Out" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
              echo "</pre>"
            } > body.md
            gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@body.md || true
            exit 1
          fi
          echo "all PHP files passed php -l"

      - name: Menu layout tests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if ! php Telegram-BOT/tests/menu_layout_test.php 2>&1 | tee out.txt; then
            {
              echo "### menu layout tests failed"
              echo "<pre>"
              tail -c 3000 out.txt | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
              echo "</pre>"
            } > body.md
            gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@body.md || true
            exit 1
          fi

      - name: Admin category navigation and access checks
        run: php Telegram-BOT/tests/admin_structure_test.php

      - name: Messaging channels, channel lookup, nightly preference and trust status
        run: php Telegram-BOT/tests/messaging_settings_test.php

      - name: Shared greeting template
        run: php Telegram-BOT/tests/greeting_template_test.php

      - name: Content filter and notification pagination
        run: php Telegram-BOT/tests/content_pagination_test.php

      - name: Every menu button has a handler
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if ! php Telegram-BOT/tests/menu_routes_test.php 2>&1 | tee out.txt; then
            {
              echo "### menu route tests failed"
              echo "<pre>"
              tail -c 3000 out.txt | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
              echo "</pre>"
            } > body.md
            gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@body.md || true
            exit 1
          fi

      - name: Footer only where a menu exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if ! php Telegram-BOT/tests/menu_footer_test.php 2>&1 | tee out.txt; then
            {
              echo "### menu footer tests failed"
              echo "<pre>"
              tail -c 3000 out.txt | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
              echo "</pre>"
            } > body.md
            gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@body.md || true
            exit 1
          fi

      - name: Expiry warning cadence and deduplication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if ! php Telegram-BOT/tests/expiry_warnings_test.php 2>&1 | tee out.txt; then
            {
              echo "### expiry warning tests failed"
              echo "<pre>"
              tail -c 3000 out.txt | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
              echo "</pre>"
            } > body.md
            gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@body.md || true
            exit 1
          fi

      - name: Device list pagination
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if ! php Telegram-BOT/tests/device_pagination_test.php 2>&1 | tee out.txt; then
            {
              echo "### device list pagination tests failed"
              echo "<pre>"
              tail -c 3000 out.txt | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
              echo "</pre>"
            } > body.md
            gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@body.md || true
            exit 1
          fi
