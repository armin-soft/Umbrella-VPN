name: Android signed release candidate

# A signed build is not automatically published: device validation and a
# licensing review are still required before promoting it to a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.5'
          cache: true
      - name: Verify prerequisites
        env:
          KEYSTORE_BASE64: ${{ secrets.UMBRELLA_ANDROID_KEYSTORE_BASE64 }}
          UMBRELLA_ANDROID_STORE_PASSWORD: ${{ secrets.UMBRELLA_ANDROID_STORE_PASSWORD }}
          UMBRELLA_ANDROID_KEY_ALIAS: ${{ secrets.UMBRELLA_ANDROID_KEY_ALIAS }}
          UMBRELLA_ANDROID_KEY_PASSWORD: ${{ secrets.UMBRELLA_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 UMBRELLA_ANDROID_STORE_PASSWORD UMBRELLA_ANDROID_KEY_ALIAS UMBRELLA_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required release signing secret $name is missing."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/umbrella-release.keystore"
      - name: Fetch verified core
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Android/tools/fetch-umbrella-core.sh
      - name: Run tests
        working-directory: Android
        run: flutter pub get && flutter test
      - name: Build and verify signed candidate
        working-directory: Android
        env:
          UMBRELLA_ANDROID_KEYSTORE: ${{ runner.temp }}/umbrella-release.keystore
          UMBRELLA_ANDROID_STORE_PASSWORD: ${{ secrets.UMBRELLA_ANDROID_STORE_PASSWORD }}
          UMBRELLA_ANDROID_KEY_ALIAS: ${{ secrets.UMBRELLA_ANDROID_KEY_ALIAS }}
          UMBRELLA_ANDROID_KEY_PASSWORD: ${{ secrets.UMBRELLA_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p release-candidate
          cp "$APK" release-candidate/UmbrellaVPN-Android-release-candidate.apk
          (cd release-candidate && sha256sum UmbrellaVPN-Android-release-candidate.apk > SHA256SUMS)
      - name: Upload candidate (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: UmbrellaVPN-Android-release-candidate
          path: Android/release-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/umbrella-release.keystore"
